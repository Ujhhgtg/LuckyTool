[versions]
agp = "8.8.1"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"

navigation = "2.8.5"
kotlinx-coroutines = "1.10.1"
libsu = "6.0.0"
markwon = "4.6.2"

[plugins]
agp-app = { id = "com.android.application", version.ref = "agp" }
agp-lib = { id = "com.android.library", version.ref = "agp" }
kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
lsplugin-apksign = { id = "org.lsposed.lsplugin.apksign", version = "1.4" }
lsplugin-resopt = { id = "org.lsposed.lsplugin.resopt", version = "1.6" }
foojay-resolver-convention = { id = "org.gradle.toolchains.foojay-resolver-convention", version = "0.8.0" }

[libraries]
paranoid = { module = "com.joom.paranoid:paranoid-gradle-plugin", version = "0.3.14" }

xposed-api = { module = "de.robv.android.xposed:api", version = "82" }
yukihookapi = { module = "com.highcapable.yukihookapi:api", version = "1.2.1.1" }
ksp-yukihookapi = { module = "com.highcapable.yukihookapi:ksp-xposed", version = "1.2.1" }
dexkit = { module = "org.luckypray:dexkit", version = "2.0.3" }

betterandroid-ui-component = { module = "com.highcapable.betterandroid:ui-component", version = "1.0.6" }
material = { module = "com.google.android.material:material", version = "1.12.0" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version = "2.2.0" }
preference-ktx = { module = "androidx.preference:preference-ktx", version = "1.2.1" }
swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version = "1.1.0" }
navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }

mmkv = { module = "com.tencent:mmkv", version = "2.0.2" }
xxpermissions = { module = "com.github.getActivity:XXPermissions", version = "18.6" }
spiderman = { module = "com.github.simplepeng.SpiderMan:spiderman", version = "v1.1.9" }
fastscroll = { module = "me.zhanghai.android.fastscroll:library", version = "1.3.0" }
colorpicker = { module = "com.jaredrummler:colorpicker", version = "1.1.0" }
image-cropper = { module = "com.vanniktech:android-image-cropper", version = "4.6.0" }

androidx-annotation = { module = "androidx.annotation:annotation", version = "1.9.1" }
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version = "2.8.7" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version = "4.12.0" }
net = { module = "com.github.liangjingkanji:Net", version = "3.6.4" }

libsu-core = { module = "com.github.topjohnwu.libsu:core", version.ref = "libsu" }
libsu-service = { module = "com.github.topjohnwu.libsu:service", version.ref = "libsu" }
libsu-io = { module = "com.github.topjohnwu.libsu:io", version.ref = "libsu" }

markwon-core = { module = "io.noties.markwon:core", version.ref = "markwon" }
markwon-html = { module = "io.noties.markwon:html", version.ref = "markwon" }
markwon-image = { module = "io.noties.markwon:image", version.ref = "markwon" }
markwon-ext-tables = { module = "io.noties.markwon:ext-tables", version.ref = "markwon" }
